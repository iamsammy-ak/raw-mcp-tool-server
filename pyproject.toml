[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rawmcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) tool server built on raw JSON-RPC 2.0: strict Pydantic schemas, scoped permissions and a sandbox, no SDK."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abhishek Kumar" }]
keywords = ["mcp", "model-context-protocol", "json-rpc", "llm-tools", "sandbox", "pydantic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
http = ["starlette>=0.37", "uvicorn>=0.29"]
demo = ["rich>=13.7"]
dev = [
    "rawmcp[http,demo]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "matplotlib>=3.8",
    # The official SDK is used only as a conformance-test client. Its 2.x line needs Python 3.11+.
    "mcp>=2.3; python_version >= '3.11'",
]

[project.scripts]
rawmcp = "rawmcp.cli:main"

[project.urls]
Repository = "https://github.com/iamsammy-ak/raw-mcp-tool-server"

[tool.hatch.build.targets.wheel]
packages = ["src/rawmcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "sdk: conformance tests that drive the server with the official MCP Python SDK client",
    "subprocess: tests that spawn the server or a sandbox process",
]

[tool.mypy]
python_version = "3.10"
files = ["src/rawmcp"]
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
